[project]
name = "comma-companion-importer"
version = "0.1.0"
description = "Resumable historical comma drive importer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
comma-companion-import = "comma_companion_importer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

