[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comma-companion-media-worker"
version = "0.1.0"
description = "Isolated AV1 media worker for Comma Companion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
comma-companion-media = "comma_companion_media_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comma_companion_media_worker"]

[tool.ruff]
line-length = 160
indent-width = 2

[tool.ruff.format]
indent-style = "space"

