[project]
name = "comma-companion-backend"
version = "0.1.0"
description = "Private comma archive and control-plane API"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "fastapi>=0.116.0",
  "itsdangerous>=2.2.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[project.scripts]
comma-companion-api = "comma_companion.app:run"
comma-companion-hash-password = "comma_companion.app:hash_password_cli"
comma-companion-worker = "comma_companion.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comma_companion"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
